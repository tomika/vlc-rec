<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VLC Stream Recorder</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- app.js picks the layout classes: is-side or is-stack, plus is-compact. -->
  <div id="layout" class="layout is-side">
    <main id="panel" class="panel">
      <div class="field field-ip">
        <label class="field-label" for="ip">SRT Stream IP Address (e.g., 192.168.1.100:5000):</label>
        <div class="row">
          <input id="ip" class="text-input" type="text" />
          <button id="scanBtn" class="btn btn-blue btn-inline" type="button">Scan</button>
        </div>
      </div>

      <div class="field field-folder">
        <label class="field-label" for="outPath">Output Folder:</label>
        <div class="row">
          <input id="outPath" class="text-input" type="text" />
          <button id="browseBtn" class="btn btn-blue" type="button">Browse...</button>
        </div>
      </div>

      <div class="field field-file">
        <label class="field-label" for="filename">Output Filename (e.g., 2024-07-05):</label>
        <div class="row">
          <input id="filename" class="text-input" type="text" />
          <select id="extension" class="select-input" aria-label="Output file extension">
            <option value="mkv">mkv</option>
            <option value="mp4">mp4</option>
          </select>
        </div>
      </div>

      <label class="reconnect-option" title="Restart VLC when recording stops growing or preview stops receiving data.">
        <input id="autoReconnect" type="checkbox" />
        Automatically reconnect if the stream stalls
      </label>

      <div class="info-row">
        <span id="modeBadge" class="mode-badge" hidden></span>
        <span class="info-item info-size"><span class="info-label">File Size:</span> <span id="fileSize">0 B</span></span>
        <span class="info-item info-time"><span class="info-label">Time Elapsed:</span> <span id="elapsed">00:00:00</span></span>
      </div>

      <div class="button-row">
        <button id="recordBtn" class="btn btn-blue" type="button">Start Recording</button>
        <button id="previewBtn" class="btn btn-green" type="button">Preview Only</button>
        <button id="panelToggle" class="btn btn-toggle" type="button" aria-expanded="true" title="Hide settings" aria-label="Hide settings">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
            <circle cx="7" cy="5" r="2.3" fill="currentColor" />
            <circle cx="13" cy="10" r="2.3" fill="currentColor" />
            <circle cx="8" cy="15" r="2.3" fill="currentColor" />
          </svg>
        </button>
      </div>

      <div id="status" class="status"></div>
    </main>

    <!-- The native video window of vlc-rec-player is placed exactly over videoHost. -->
    <section id="stage" class="stage">
      <div id="videoHost" class="video-host" aria-label="Video preview">
        <span class="video-placeholder">Preview appears here</span>
      </div>
    </section>
  </div>

  <div id="scanDialog" class="scan-dialog" role="dialog" aria-modal="true" aria-labelledby="scanTitle" hidden>
    <div class="scan-card">
      <div class="scan-header">
        <h2 id="scanTitle" class="scan-title">Scan for SRT Hosts</h2>
        <button id="closeScanBtn" class="scan-close-btn" type="button" aria-label="Close scan dialog">&times;</button>
      </div>

      <div class="scan-body">

        <div class="scan-form-row">
          <label class="scan-inline-label" for="scanMask">Mask</label>
          <input id="scanMask" class="text-input scan-mask-input" type="text" placeholder="192.168.1.* or empty for local subnets" />

          <label class="scan-inline-label" for="scanPort">Port</label>
          <input id="scanPort" class="text-input scan-port-input" type="number" min="1" max="65535" step="1" placeholder="5000" />
        </div>

        <div class="scan-actions">
          <button id="startScanBtn" class="btn btn-blue" type="button">Start Scan</button>
          <button id="abortScanBtn" class="btn btn-red" type="button">Abort Scan</button>
        </div>

        <div id="scanProgress" class="scan-progress">Idle.</div>
        <div id="scanCurrent" class="scan-current">Current: idle</div>
        <div id="scanProgressBar" class="scan-progressbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="scanProgressBarFill" class="scan-progressbar-fill">0%</div>
        </div>

        <label class="field-label" for="scanResults">Found addresses</label>
        <select id="scanResults" class="scan-results" size="3" aria-label="Found address list"></select>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
